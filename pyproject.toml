[project]
name = "dnaberts-benchmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "biopython>=1.87",
    "datasets>=4.8.4",
    "einops>=0.8.2",
    "evaluate>=0.4.6",
    "hydra-core>=1.3.2",
    "mlflow>=3.2.0,<4.0.0",
    "pandas>=2.2.0,<3.0.0",
    "protobuf>=4.25.0,<6.0.0",
    "peft>=0.10.0",
    "pyfaidx>=0.9.0.4",
    "pysam>=0.23.3",
    "scikit-learn>=1.8.0",
    "tf-keras>=2.20.1",
    "tokenizers>=0.22.2",
    "transformers==4.57.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
mlflow-ui = "mlflow ui --backend-store-uri file:./mlruns --host 127.0.0.1 --port 5000"

#downloads all gue datasets
download-gue = """
TASKS="prom_core_all splice_reconstructed human_tf_0 mouse_0 EPI_HUVEC emp_H3K4me1 fungi_species_20 "

for task in $TASKS; do
    echo "=== Downloading $task ==="
    uv run python scripts/prepare_hf_dataset.py leannmlindsey/GUE --task "$task"
done
""" 

[[tool.uv.index]]
name = "pytorch-cu13"
url = "https://download.pytorch.org/whl/cu13"
explicit = true
