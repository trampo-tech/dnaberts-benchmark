[project]
name = "dnaberts-benchmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "biopython>=1.87",
    "datasets>=4.8.4",
    "evaluate>=0.4.6",
    "hydra-core>=1.3.2",
    "mlflow>=3.2.0,<4.0.0",
    "multimolecule>=0.0.9",
    "pandas>=2.2.0,<3.0.0",
    "protobuf>=4.25.0,<6.0.0",
    "scikit-learn>=1.8.0",
    "seqio>=0.0.20",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "taskipy>=1.14.1",
]
baseline = [
    "transformers>=5.5.3",
]
nucleotide = [
    "tf-keras>=2.20.1",
    "tokenizers>=0.22.2",
    "transformers<5",
]

[tool.uv]
conflicts = [
    [
        { group = "baseline" },
        { group = "nucleotide" },
    ],
]

[tool.taskipy.tasks]
mlflow-ui = "mlflow ui --backend-store-uri file:./mlruns --host 127.0.0.1 --port 5000"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
