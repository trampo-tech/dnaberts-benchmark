output_root: runs
leaderboard_csv: ${hydra:runtime.cwd}/reports/benchmark_results.csv
num_labels: 2
learning_rate: 2e-5
epochs: 3
train_bs: 16 # bs = batch_size
eval_bs: 32
weight_decay: 0.01
eval_strategy: steps
save_strategy: steps
save_total_limit: 1
logging_steps: 20
eval_steps: 250
metric_for_best_model: f1
early_stopping_patience: 2
early_stopping_threshold: 0.0
fp16: true
report_to: mlflow 
enable_mlflow: true
mlflow_tracking_uri: file:${hydra:runtime.cwd}/mlruns
mlflow_experiment: ${experiment_name}